---
layout: default
---
{%- comment -%}
  page.html — generic page (About, Process, Contact, etc.).
{%- endcomment -%}

<header class="page-header">
  <div class="container">
    <span class="eyebrow">{% if page.eyebrow %}{{ page.eyebrow }}{% else %}{{ site.title }}{% endif %}</span>
    <h1 class="page-header__title mt-4">{{ page.title }}</h1>
    {%- if page.description -%}
      <p class="page-header__lead mt-4">{{ page.description }}</p>
    {%- endif -%}
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>
