---
layout: default
---
{%- comment -%}
  journal-detail.html — single journal post.
{%- endcomment -%}

<article>
  <header class="page-header">
    <div class="container">
      <span class="eyebrow">Journal · {{ page.date | date: "%B %-d, %Y" }}</span>
      <h1 class="page-header__title mt-4">{{ page.title }}</h1>
      {%- if page.description -%}<p class="page-header__lead mt-4">{{ page.description }}</p>{%- endif -%}
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </section>
</article>
