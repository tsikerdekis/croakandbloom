# =====================================================================
# Croak and Bloom — modern ceramicist site
# =====================================================================

# Site identity
title: Croak and Bloom
tagline: Nature inspired ceramics from Bellingham, Washington
description: >-
  Nature inspired ceramics, pottery and floral gifts, handmade in small batches
  by ceramic artist Anna Poupa in Bellingham, Washington.
author:
  name: Anna Poupa
  email: anna@croakandbloom.com
  location: Bellingham, Washington, USA
  social:
    instagram: https://www.instagram.com/croakandbloom/
    linkedin: https://www.linkedin.com/in/anna-poupa-tsikerdekis-b88a345b/
    etsy: https://www.etsy.com/shop/CroakandBloom

# Forms
# Web3Forms (api.web3forms.com) backend: keeps our own styled HTML and just
# emails submissions to access_key's verified address. Free tier is 250
# submissions/month, unlimited forms. Get a key at app.web3forms.com.
# NOTE: Web3Forms only accepts client-side submissions; a server-side POST is
# rejected, so this must stay a browser form, not a fetch from CI.
forms:
  web3forms_key: "80f5bef9-356c-4a8d-8628-61065b810cdd"
  # Set to e.g. the Zoho permalink to switch providers. Empty means Web3Forms.
  contact_endpoint: ""
  # Legacy Zoho embed, kept so the switch can be reverted by restoring this value.
  zoho_embed_url: ""

# Hostname & base
baseurl: ""
url: "https://new.croakandbloom.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: America/Los_Angeles

sass:
  style: compressed
  quiet_deps: true

plugins:
  - jekyll-sass-converter
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  works:
    output: true
    permalink: /work/:path/
  collections_dir:
    output: true
    permalink: /collections/:path/
  journal:
    output: true
    permalink: /journal/:path/

defaults:
  - scope:
      path: ""
      type: works
    values:
      layout: work-detail
      materials: ""
      dimensions: ""
      year: ""
      sold: false
      featured: false
      gallery: []
  - scope:
      path: ""
      type: collections_dir
    values:
      layout: collection-detail
      summary: ""
  - scope:
      path: ""
      type: journal
    values:
      layout: journal-detail
  - scope:
      path: ""
    values:
      layout: default
      nav-menu: false

# Build exclusions
exclude:
  - "*.gemspec"
  - "LICENSE.md"
  - "CONTRIBUTING.md"
  - "README.md"
  - "Gemfile.lock"
  - "vendor"
  - ".bundle"
  - "node_modules"
  - "docs"
  - "lighthouse.md"
  - "a11y.md"
  - ".github"
  - "AGENTS.md"
  - "tools"
  - "tmp"
  - "tmp_preview"
  - "tmp_preview2"
  - "assets/images/desc.txt"
  - "assets/images/instagram_posts_map.txt"
  - "assets/images/REPLACEMENT-REPORT.md"
  - "*.log"
